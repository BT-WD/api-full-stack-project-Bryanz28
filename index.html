<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri App – Search Foods</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header>
    <h1>Nutri App</h1>
    <p>Search Foods & Track Your Macros</p>

    <!-- Leaf Logo (top-right) -->
    <img src="assets/leaf.png" alt="Leaf Logo" class="leaf-logo">
  </header>

  <main>

    <!-- DISCLAIMER -->
    <p class="disclaimer">⚠️ May lag due to API rate limits</p>

    <!-- FOOD SEARCH SECTION -->
    <section class="search-section">
      <h2>Search Foods</h2>

      <div class="search-box">
        <input id="ingredient-input" type="text" placeholder="Search for a food (e.g., apple)">
        <button id="ingredient-search-btn">Search</button>
      </div>

      <ul id="ingredient-results" class="results-list"></ul>
    </section>

    <!-- MACRO TOTALS -->
    <section class="macros-section">
      <h2>Daily Macros</h2>

      <div class="macro-grid">
        <div class="macro-box">
          <h3>Calories</h3>
          <p id="total-calories">0</p>
        </div>

        <div class="macro-box">
          <h3>Protein</h3>
          <p id="total-protein">0g</p>
        </div>

        <div class="macro-box">
          <h3>Carbs</h3>
          <p id="total-carbs">0g</p>
        </div>

        <div class="macro-box">
          <h3>Fiber</h3>
          <p id="total-fiber">0g</p>
        </div>
      </div>

      <button id="reset-btn" class="reset-btn">Reset Totals</button>
    </section>

  </main>

  <script src="index.js"></script>
</body>
</html>
